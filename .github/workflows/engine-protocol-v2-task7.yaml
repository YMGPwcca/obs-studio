name: Engine Protocol v2 Task 7 Verification

on:
  push:
    branches:
      - engine-protocol-v2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-smoke-package-x64:
    name: Build, generic properties smoke test, and package x64
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Build Windows minimal runtime
        uses: ./.github/actions/build-obs
        with:
          target: x64
          config: RelWithDebInfo

      - name: Build and run generic properties bridge test
        id: properties_policy
        continue-on-error: true
        timeout-minutes: 5
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $InstallRoot = Resolve-Path 'build_x64/install'
          $DiagnosticDir = Join-Path $InstallRoot '_task7-diagnostics'
          New-Item -ItemType Directory -Force -Path $DiagnosticDir | Out-Null
          $DiagnosticFile = Join-Path $DiagnosticDir 'properties-bridge-test.txt'
          $FailureText = $null
          $OutputText = ''

          try {
            & cmake --build build_x64 --config RelWithDebInfo --target obs-engine-properties-test 2>&1 |
              Tee-Object -Variable BuildOutput | Write-Host
            if ( $LASTEXITCODE -ne 0 ) {
              throw "obs-engine-properties-test failed to build (exit=$LASTEXITCODE)."
            }

            $PropertiesTest = Get-ChildItem -Path 'build_x64' -Filter 'obs-engine-properties-test.exe' -File -Recurse |
              Select-Object -First 1
            if ( $null -eq $PropertiesTest ) {
              throw 'obs-engine-properties-test.exe was not found after explicit test-target build.'
            }

            $Engine = Get-ChildItem -Path $InstallRoot -Filter 'obs-engine.exe' -File -Recurse |
              Select-Object -First 1
            if ( $null -eq $Engine ) {
              throw 'obs-engine.exe was not found in the installed runtime.'
            }
            $Env:PATH = "$($Engine.Directory.FullName);$Env:PATH"

            $OutputText = (& $PropertiesTest.FullName 2>&1 | Out-String)
            Write-Host $OutputText
            if ( $LASTEXITCODE -ne 0 ) {
              throw "obs-engine-properties-test.exe failed (exit=$LASTEXITCODE)."
            }
            if ( $OutputText -notmatch 'properties-test: passed' ) {
              throw 'Properties bridge test did not report its success marker.'
            }

            $LeakedTest = Get-ChildItem -Path $InstallRoot -Filter 'obs-engine-properties-test.exe' -File -Recurse |
              Select-Object -First 1
            if ( $null -ne $LeakedTest ) {
              throw 'CI-only properties test executable leaked into the installed runtime.'
            }
          }
          catch {
            $FailureText = ($_ | Out-String)
            Write-Error $FailureText
          }
          finally {
            @(
              '=== properties test output ==='
              $OutputText
              ''
              '=== properties test failure ==='
              $FailureText
            ) | Set-Content -Path $DiagnosticFile -Encoding utf8
          }

          if ( $null -ne $FailureText ) {
            throw 'Generic properties bridge test failed. See _task7-diagnostics/properties-bridge-test.txt in the runtime artifact.'
          }

      - name: Smoke test protocol v2 properties API
        id: smoke_v2_properties
        continue-on-error: true
        timeout-minutes: 5
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $InstallRoot = Resolve-Path 'build_x64/install'
          $DiagnosticDir = Join-Path $InstallRoot '_task7-diagnostics'
          New-Item -ItemType Directory -Force -Path $DiagnosticDir | Out-Null
          $DiagnosticFile = Join-Path $DiagnosticDir 'v2-properties-smoke.txt'

          $Process = $null
          $ErrorTask = $null
          $Engine = $null
          $FailureText = $null

          try {
            $Engine = Get-ChildItem -Path $InstallRoot -Filter 'obs-engine.exe' -File -Recurse |
              Select-Object -First 1
            if ( $null -eq $Engine ) {
              throw 'obs-engine.exe was not found in the installed runtime.'
            }

            $StartInfo = [System.Diagnostics.ProcessStartInfo]::new()
            $StartInfo.FileName = $Engine.FullName
            $StartInfo.WorkingDirectory = $Engine.Directory.FullName
            $StartInfo.UseShellExecute = $false
            $StartInfo.RedirectStandardInput = $true
            $StartInfo.RedirectStandardOutput = $true
            $StartInfo.RedirectStandardError = $true
            $StartInfo.CreateNoWindow = $true

            $Process = [System.Diagnostics.Process]::new()
            $Process.StartInfo = $StartInfo
            if ( -not $Process.Start() ) {
              throw 'Failed to start obs-engine.exe.'
            }
            $ErrorTask = $Process.StandardError.ReadToEndAsync()

            function Read-EngineMessage {
              $ReadTask = $Process.StandardOutput.ReadLineAsync()
              if ( -not $ReadTask.Wait(30000) ) {
                throw 'Timed out waiting 30 seconds for obs-engine stdout.'
              }
              $Line = $ReadTask.Result
              if ( $null -eq $Line ) {
                $ExitText = if ( $Process.HasExited ) { "exit=$($Process.ExitCode)" } else { 'process still running' }
                throw "obs-engine closed stdout unexpectedly ($ExitText)."
              }
              Write-Host "obs-engine stdout: $Line"
              return ($Line | ConvertFrom-Json)
            }

            function Send-V2Request([hashtable] $Request) {
              $Json = $Request | ConvertTo-Json -Compress -Depth 40
              Write-Host "obs-engine stdin:  $Json"
              $Process.StandardInput.WriteLine($Json)
              $Process.StandardInput.Flush()
              $Response = Read-EngineMessage
              if ( $Response.op -ne 'response' -or [string]$Response.id -ne [string]$Request.id ) {
                throw "Expected response for '$($Request.id)' but received a different message."
              }
              return $Response
            }

            $Ready = Read-EngineMessage
            if ( $Ready.event -ne 'ready' -or [int]$Ready.protocol -ne 1 ) {
              throw 'Migration bootstrap ready event changed unexpectedly.'
            }

            $Hello = Send-V2Request @{
              op = 'request'
              id = 'task7.hello'
              method = 'session.hello'
              params = @{}
            }
            if ( -not $Hello.status.ok -or [int64]$Hello.revision -ne 0 ) {
              throw 'session.hello failed or a new engine did not begin at revision 0.'
            }
            $CapabilityNames = @($Hello.data.capabilities | ForEach-Object { [string]$_.name })
            foreach ( $Required in @(
              'properties.v1'
              'properties.get.v1'
              'properties.getListItems.v1'
              'properties.invokeButton.v1'
              'properties.refresh.v1'
              'properties.resolve.v1'
              'properties.validate.v1'
            ) ) {
              if ( $CapabilityNames -notcontains $Required ) {
                throw "Task 7 capability was not advertised: $Required"
              }
            }

            $SlideTarget = @{ type = 'sourceKind'; kind = 'slideshow_v2' }
            $Schema = Send-V2Request @{
              op = 'request'
              id = 'task7.kind-schema'
              method = 'properties.get'
              params = @{ target = $SlideTarget }
            }
            if ( -not $Schema.status.ok -or [int64]$Schema.revision -ne 0 -or
                 [string]$Schema.data.target.type -ne 'sourceKind' -or
                 [string]$Schema.data.target.kind -ne 'slideshow_v2' ) {
              throw 'properties.get did not return the slideshow_v2 source-kind form at revision 0.'
            }
            $BehaviorProperty = @($Schema.data.properties | Where-Object { $_.name -eq 'playback_behavior' }) | Select-Object -First 1
            $SpeedProperty = @($Schema.data.properties | Where-Object { $_.name -eq 'transition_speed' }) | Select-Object -First 1
            if ( $null -eq $BehaviorProperty -or [string]$BehaviorProperty.type -ne 'list' ) {
              throw 'slideshow_v2 playback_behavior list property was not serialized.'
            }
            if ( $null -eq $SpeedProperty -or [string]$SpeedProperty.type -ne 'int' -or
                 [int]$SpeedProperty.min -ne 0 -or [int]$SpeedProperty.max -ne 3600000 ) {
              throw 'slideshow_v2 transition_speed numeric constraints were not serialized.'
            }

            $ListItems = Send-V2Request @{
              op = 'request'
              id = 'task7.list-items'
              method = 'properties.getListItems'
              params = @{
                target = $SlideTarget
                property = 'playback_behavior'
              }
            }
            if ( -not $ListItems.status.ok -or [int64]$ListItems.revision -ne 0 -or
                 [int]$ListItems.data.itemCount -ne 3 ) {
              throw 'properties.getListItems did not return the slideshow playback behavior choices.'
            }
            $BehaviorValues = @($ListItems.data.items | ForEach-Object { [string]$_.value })
            foreach ( $Expected in @('always_play', 'stop_restart', 'pause_unpause') ) {
              if ( $BehaviorValues -notcontains $Expected ) {
                throw "playback_behavior list lost expected value '$Expected'."
              }
            }

            $Resolved = Send-V2Request @{
              op = 'request'
              id = 'task7.resolve'
              method = 'properties.resolve'
              params = @{
                target = $SlideTarget
                settings = @{ slide_mode = 'mode_manual' }
                changedProperty = 'slide_mode'
              }
            }
            if ( -not $Resolved.status.ok -or [int64]$Resolved.revision -ne 0 -or
                 [string]$Resolved.data.settings.slide_mode -ne 'mode_manual' ) {
              throw 'properties.resolve did not apply candidate settings to a non-mutating working copy.'
            }

            $Validation = Send-V2Request @{
              op = 'request'
              id = 'task7.validate'
              method = 'properties.validate'
              params = @{
                target = $SlideTarget
                settings = @{ transition_speed = -1 }
              }
            }
            if ( -not $Validation.status.ok -or [int64]$Validation.revision -ne 0 -or $Validation.data.valid ) {
              throw 'properties.validate did not reject an out-of-range transition_speed without mutating revision state.'
            }
            $SpeedIssue = @($Validation.data.issues | Where-Object { $_.property -eq 'transition_speed' -and $_.code -eq 'range' }) |
              Select-Object -First 1
            if ( $null -eq $SpeedIssue ) {
              throw 'properties.validate did not report the transition_speed range issue.'
            }

            $Kinds = Send-V2Request @{
              op = 'request'
              id = 'task7.kinds'
              method = 'source.kindList'
              params = @{}
            }
            $ColorKind = $Kinds.data.kinds | Where-Object { $_.id -eq 'color_source_v3' } | Select-Object -First 1
            if ( $null -eq $ColorKind ) {
              $ColorKind = $Kinds.data.kinds | Where-Object { $_.id -eq 'color_source' } | Select-Object -First 1
            }
            if ( $null -eq $ColorKind ) {
              throw 'No Color Source kind was registered.'
            }

            $Source = Send-V2Request @{
              op = 'request'
              id = 'task7.source-create'
              method = 'source.create'
              params = @{
                kind = [string]$ColorKind.id
                name = 'task7-color'
                settings = @{ width = 320; height = 180; color = 4294901760 }
              }
              ifRevision = 0
            }
            if ( -not $Source.status.ok -or [int64]$Source.revision -ne 1 ) {
              throw 'Task 7 fixture source did not commit revision 1.'
            }
            $SourceHandle = [string]$Source.data.source
            if ( $SourceHandle -notmatch '^[1-9][0-9]*$' ) {
              throw 'Task 7 fixture source handle was not canonical.'
            }
            $LiveTarget = @{ type = 'source'; source = $SourceHandle }

            $LiveSchema = Send-V2Request @{
              op = 'request'
              id = 'task7.live-get'
              method = 'properties.get'
              params = @{ target = $LiveTarget }
            }
            if ( -not $LiveSchema.status.ok -or [int64]$LiveSchema.revision -ne 1 -or
                 [int]$LiveSchema.data.settings.width -ne 320 ) {
              throw 'properties.get did not read live source settings at revision 1.'
            }

            $LiveResolved = Send-V2Request @{
              op = 'request'
              id = 'task7.live-resolve'
              method = 'properties.resolve'
              params = @{
                target = $LiveTarget
                settings = @{ width = 777 }
                changedProperty = 'width'
              }
            }
            if ( -not $LiveResolved.status.ok -or [int64]$LiveResolved.revision -ne 1 -or
                 [int]$LiveResolved.data.settings.width -ne 777 ) {
              throw 'properties.resolve did not expose the live-source working candidate at unchanged revision 1.'
            }

            $ActualSettings = Send-V2Request @{
              op = 'request'
              id = 'task7.actual-settings'
              method = 'source.getSettings'
              params = @{ source = $SourceHandle }
            }
            if ( -not $ActualSettings.status.ok -or [int64]$ActualSettings.revision -ne 1 -or
                 [int]$ActualSettings.data.settings.width -ne 320 ) {
              throw 'properties.resolve leaked its working width into the real source settings.'
            }

            $Refresh = Send-V2Request @{
              op = 'request'
              id = 'task7.refresh'
              method = 'properties.refresh'
              params = @{ target = $LiveTarget }
            }
            if ( -not $Refresh.status.ok -or [int64]$Refresh.revision -ne 1 -or
                 -not $Refresh.data.refreshed -or [int]$Refresh.data.settings.width -ne 320 ) {
              throw 'properties.refresh did not rebuild the real live-source state.'
            }

            $NotButton = Send-V2Request @{
              op = 'request'
              id = 'task7.not-button'
              method = 'properties.invokeButton'
              params = @{ target = $LiveTarget; property = 'width' }
              ifRevision = 1
            }
            if ( $NotButton.status.ok -or $NotButton.status.code -ne 'bad_request' -or
                 [int64]$NotButton.revision -ne 1 ) {
              throw 'properties.invokeButton accepted a non-button property or consumed a revision on rejection.'
            }

            $Close = Send-V2Request @{
              op = 'request'
              id = 'task7.close'
              method = 'session.close'
              params = @{}
              ifRevision = 1
            }
            if ( -not $Close.status.ok -or [int64]$Close.revision -ne 2 ) {
              throw 'session.close did not commit revision 2 after the Task 7 read-only property calls.'
            }

            $Process.StandardInput.Close()
            if ( -not $Process.WaitForExit(15000) ) {
              $Process.Kill($true)
              throw 'obs-engine did not exit after Task 7 session.close.'
            }
            if ( $Process.ExitCode -ne 0 ) {
              throw "obs-engine exited with code $($Process.ExitCode)."
            }

            Write-Host 'Protocol-v2 properties smoke test passed.'
          }
          catch {
            $FailureText = ($_ | Out-String)
            Write-Error $FailureText
            if ( $null -ne $Process -and -not $Process.HasExited ) {
              try {
                $Process.Kill($true)
                $Process.WaitForExit(5000) | Out-Null
              }
              catch {
                Write-Warning "Failed to terminate obs-engine after Task 7 smoke failure: $_"
              }
            }
          }
          finally {
            $StderrText = ''
            if ( $null -ne $ErrorTask ) {
              try {
                $StderrText = $ErrorTask.GetAwaiter().GetResult()
              }
              catch {
                $StderrText = "Failed to collect redirected stderr: $_"
              }
            }

            $ExitState = 'not-started'
            if ( $null -ne $Process ) {
              if ( $Process.HasExited ) {
                $ExitState = "exited:$($Process.ExitCode)"
              } else {
                $ExitState = 'still-running'
              }
            }

            @(
              "engine=$($Engine.FullName)"
              "exit_state=$ExitState"
              ''
              '=== smoke failure ==='
              $FailureText
              ''
              '=== obs-engine stderr ==='
              $StderrText
            ) | Set-Content -Path $DiagnosticFile -Encoding utf8
          }

          if ( $null -ne $FailureText ) {
            throw 'Protocol-v2 properties smoke test failed. See _task7-diagnostics/v2-properties-smoke.txt in the runtime artifact.'
          }

      - name: Upload Task 7 Windows runtime
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: obs-engine-windows-x64-task7
          path: build_x64/install/
          if-no-files-found: error
          compression-level: 6
          retention-days: 7

      - name: Enforce Task 7 test results
        if: steps.properties_policy.outcome != 'success' || steps.smoke_v2_properties.outcome != 'success'
        shell: pwsh
        run: |
          throw 'Task 7 properties verification failed; runtime artifact was preserved for diagnostics.'
