name: Engine Protocol v2 Task 23 Verification

on:
  push:
    branches:
      - phase3-output-stack
  workflow_dispatch:

permissions:
  contents: read

jobs:
  encoder-v1:
    name: Build and verify encoder namespace
    runs-on: windows-2025-vs2026
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Build Windows minimal runtime
        uses: ./.github/actions/build-obs
        with:
          target: x64
          config: RelWithDebInfo
      - name: Audit normal package
        shell: pwsh
        run: '& .github/scripts/engine-protocol-v2-task23-package-audit.ps1 -InstallRoot (Resolve-Path ''build_x64/install'')'
      - name: Build CI-only encoder fixture
        shell: pwsh
        run: '& .github/scripts/engine-protocol-v2-task23-build-fixture.ps1'
      - name: Stage CI-only encoder fixture
        shell: pwsh
        run: '& .github/scripts/engine-protocol-v2-task23-stage-fixture.ps1 -InstallRoot (Resolve-Path ''build_x64/install'') -FixtureBinary (Resolve-Path ''build_x64/engine/RelWithDebInfo/task23-encoder.dll'')'
      - name: Run Task 23 encoder integration
        shell: pwsh
        run: '& .github/scripts/engine-protocol-v2-task23.ps1 -InstallRoot (Resolve-Path ''build_x64/install'')'
      - name: Run active encoder update bridge test
        shell: pwsh
        run: '& .github/scripts/engine-protocol-v2-task23-run-bridge-test.ps1'
      - name: Remove CI-only encoder fixture
        if: always()
        shell: pwsh
        run: '& .github/scripts/engine-protocol-v2-task23-remove-fixture.ps1 -InstallRoot (Resolve-Path ''build_x64/install'')'
      - name: Audit package after fixture cleanup
        if: always()
        shell: pwsh
        run: '& .github/scripts/engine-protocol-v2-task23-package-audit.ps1 -InstallRoot (Resolve-Path ''build_x64/install'')'
