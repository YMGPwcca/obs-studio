name: Engine Protocol v2 Task 25 Verification

on:
  push:
    branches:
      - phase3-output-stack
  workflow_dispatch:

permissions:
  contents: read

jobs:
  service-v1:
    name: Build and verify secret-aware service namespace
    runs-on: windows-2025-vs2026
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Build Windows minimal runtime
        uses: ./.github/actions/build-obs
        with:
          target: x64
          config: RelWithDebInfo
      - name: Audit normal package
        shell: pwsh
        run: '& .github/scripts/engine-protocol-v2-task25-package-audit.ps1 -InstallRoot (Resolve-Path ''build_x64/install'')'
      - name: Build CI-only service fixture
        shell: pwsh
        run: '& .github/scripts/engine-protocol-v2-task25-build-fixture.ps1'
      - name: Stage CI-only service fixture
        shell: pwsh
        run: '& .github/scripts/engine-protocol-v2-task25-stage-fixture.ps1 -InstallRoot (Resolve-Path ''build_x64/install'') -FixtureBinary (Resolve-Path ''build_x64/engine/RelWithDebInfo/task25-service.dll'')'
      - name: Run Task 25 service integration
        shell: pwsh
        run: '& .github/scripts/engine-protocol-v2-task25.ps1 -InstallRoot (Resolve-Path ''build_x64/install'')'
      - name: Remove CI-only service fixture
        if: always()
        shell: pwsh
        run: '& .github/scripts/engine-protocol-v2-task25-remove-fixture.ps1 -InstallRoot (Resolve-Path ''build_x64/install'')'
      - name: Audit package after fixture cleanup
        if: always()
        shell: pwsh
        run: '& .github/scripts/engine-protocol-v2-task25-package-audit.ps1 -InstallRoot (Resolve-Path ''build_x64/install'')'
