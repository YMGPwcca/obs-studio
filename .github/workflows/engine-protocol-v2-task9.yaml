name: Engine Protocol v2 Task 9 Verification

on:
  push:
    branches:
      - engine-protocol-v2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  interaction-v1:
    name: Build and verify interaction namespace
    runs-on: windows-2025-vs2026
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Build Windows minimal runtime
        uses: ./.github/actions/build-obs
        with:
          target: x64
          config: RelWithDebInfo

      - name: Verify normal package excludes Task 9 test source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & .github/scripts/engine-protocol-v2-task9-package-audit.ps1
      - name: Build CI-only deterministic interaction source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & .github/scripts/engine-protocol-v2-task9-build-fixture.ps1
      - name: Stage CI-only interaction source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & .github/scripts/engine-protocol-v2-task9-stage-fixture.ps1
      - name: Run Task 9 interaction integration regression
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & '.github/scripts/engine-protocol-v2-task9.ps1' -InstallRoot (Resolve-Path 'build_x64/install')

      - name: Remove explicitly staged Task 9 test source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & .github/scripts/engine-protocol-v2-task9-remove-fixture.ps1
      - name: Upload Task 9 Windows runtime
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: obs-engine-windows-x64-task9
          path: build_x64/install/
          if-no-files-found: error
          compression-level: 6
          retention-days: 7
