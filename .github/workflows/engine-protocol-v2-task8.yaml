name: Engine Protocol v2 Task 8 Verification

on:
  push:
    branches:
      - engine-protocol-v2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-smoke-package-x64:
    name: Build, complete source namespace smoke test, and package x64
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Build Windows minimal runtime
        uses: ./.github/actions/build-obs
        with:
          target: x64
          config: RelWithDebInfo

      - name: Smoke test complete protocol v2 source namespace
        id: smoke_v2_source
        continue-on-error: true
        timeout-minutes: 5
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $InstallRoot = Resolve-Path 'build_x64/install'
          $DiagnosticDir = Join-Path $InstallRoot '_task8-diagnostics'
          New-Item -ItemType Directory -Force -Path $DiagnosticDir | Out-Null
          $DiagnosticFile = Join-Path $DiagnosticDir 'v2-source-smoke.txt'

          $Process = $null
          $ErrorTask = $null
          $Engine = $null
          $FailureText = $null
          $NextSeq = [uint64]1

          try {
            $Engine = Get-ChildItem -Path $InstallRoot -Filter 'obs-engine.exe' -File -Recurse |
              Select-Object -First 1
            if ( $null -eq $Engine ) {
              throw 'obs-engine.exe was not found in the installed runtime.'
            }

            $StartInfo = [System.Diagnostics.ProcessStartInfo]::new()
            $StartInfo.FileName = $Engine.FullName
            $StartInfo.WorkingDirectory = $Engine.Directory.FullName
            $StartInfo.UseShellExecute = $false
            $StartInfo.RedirectStandardInput = $true
            $StartInfo.RedirectStandardOutput = $true
            $StartInfo.RedirectStandardError = $true
            $StartInfo.CreateNoWindow = $true

            $Process = [System.Diagnostics.Process]::new()
            $Process.StartInfo = $StartInfo
            if ( -not $Process.Start() ) {
              throw 'Failed to start obs-engine.exe.'
            }
            $ErrorTask = $Process.StandardError.ReadToEndAsync()

            function Read-EngineMessage {
              $ReadTask = $Process.StandardOutput.ReadLineAsync()
              if ( -not $ReadTask.Wait(30000) ) {
                throw 'Timed out waiting 30 seconds for obs-engine stdout.'
              }
              $Line = $ReadTask.Result
              if ( $null -eq $Line ) {
                $ExitText = if ( $Process.HasExited ) { "exit=$($Process.ExitCode)" } else { 'process still running' }
                throw "obs-engine closed stdout unexpectedly ($ExitText)."
              }
              Write-Host "obs-engine stdout: $Line"
              return ($Line | ConvertFrom-Json)
            }

            function Send-V2Request([hashtable] $Request) {
              $Json = $Request | ConvertTo-Json -Compress -Depth 50
              Write-Host "obs-engine stdin:  $Json"
              $Process.StandardInput.WriteLine($Json)
              $Process.StandardInput.Flush()
              $Response = Read-EngineMessage
              if ( $Response.op -ne 'response' -or [string]$Response.id -ne [string]$Request.id ) {
                throw "Expected response for '$($Request.id)' but received a different message."
              }
              return $Response
            }

            function Read-StateEvent([string] $Name, [int64] $Revision) {
              $Event = Read-EngineMessage
              if ( $Event.op -ne 'event' -or [string]$Event.event -ne $Name ) {
                throw "Expected event '$Name' but received '$($Event.event)'."
              }
              if ( [uint64]$Event.seq -ne $script:NextSeq ) {
                throw "Event '$Name' had seq=$($Event.seq), expected $script:NextSeq."
              }
              if ( [int64]$Event.revision -ne $Revision ) {
                throw "Event '$Name' had revision=$($Event.revision), expected $Revision."
              }
              $script:NextSeq++
              return $Event
            }

            function Assert-CanonicalHandle([string] $Handle, [string] $Label) {
              if ( $Handle -notmatch '^[1-9][0-9]*$' ) {
                throw "$Label was not a canonical decimal string handle: '$Handle'"
              }
            }

            $AllSourceCapabilities = @(
              'source.v1'
              'source.kindList.v1'
              'source.kindGet.v1'
              'source.kindDefaults.v1'
              'source.kindProperties.v1'
              'source.list.v1'
              'source.get.v1'
              'source.create.v1'
              'source.duplicate.v1'
              'source.remove.v1'
              'source.rename.v1'
              'source.getSettings.v1'
              'source.patchSettings.v1'
              'source.replaceSettings.v1'
              'source.resetSettings.v1'
              'source.getProperties.v1'
              'source.getFlags.v1'
              'source.getDimensions.v1'
              'source.getState.v1'
              'source.getActive.v1'
              'source.getShowing.v1'
              'source.getMissingFiles.v1'
              'source.refresh.v1'
              'source.saveState.v1'
              'source.loadState.v1'
            )

            $Ready = Read-EngineMessage
            if ( $Ready.event -ne 'ready' -or [int]$Ready.protocol -ne 1 ) {
              throw 'Migration bootstrap ready event changed unexpectedly.'
            }

            $Hello = Send-V2Request @{
              op = 'request'; id = 'task8.hello'; method = 'session.hello'; params = @{}
            }
            if ( -not $Hello.status.ok -or [int64]$Hello.revision -ne 0 ) {
              throw 'session.hello failed or a new engine did not begin at revision 0.'
            }
            $CapabilityNames = @($Hello.data.capabilities | ForEach-Object { [string]$_.name })
            foreach ( $Required in $AllSourceCapabilities ) {
              if ( $CapabilityNames -notcontains $Required ) {
                throw "Task 8 capability was not advertised: $Required"
              }
            }

            $Subscribe = Send-V2Request @{
              op = 'request'; id = 'task8.subscribe'; method = 'session.subscribe'
              params = @{ subscriptions = @(@{ pattern = 'source.*' }) }
            }
            if ( -not $Subscribe.status.ok -or [int64]$Subscribe.revision -ne 0 ) {
              throw 'Task 8 source event subscription failed.'
            }

            $Kinds = Send-V2Request @{
              op = 'request'; id = 'task8.kinds'; method = 'source.kindList'; params = @{}
            }
            $ColorKind = $Kinds.data.kinds | Where-Object { $_.id -eq 'color_source_v3' } | Select-Object -First 1
            if ( $null -eq $ColorKind ) {
              $ColorKind = $Kinds.data.kinds | Where-Object { $_.id -eq 'color_source' } | Select-Object -First 1
            }
            if ( $null -eq $ColorKind ) {
              throw 'No Color Source kind was registered.'
            }
            $KindId = [string]$ColorKind.id

            $Kind = Send-V2Request @{
              op = 'request'; id = 'task8.kind'; method = 'source.kindGet'; params = @{ kind = $KindId }
            }
            if ( -not $Kind.status.ok -or [int64]$Kind.revision -ne 0 -or
                 [string]$Kind.data.id -ne $KindId -or -not [bool]$Kind.data.hasVideo -or
                 [bool]$Kind.data.hasAudio ) {
              throw 'source.kindGet did not expose correct semantic Color Source flags.'
            }

            $KindDefaults = Send-V2Request @{
              op = 'request'; id = 'task8.kind-defaults'; method = 'source.kindDefaults'; params = @{ kind = $KindId }
            }
            if ( -not $KindDefaults.status.ok -or [int64]$KindDefaults.revision -ne 0 ) {
              throw 'source.kindDefaults failed or mutated revision state.'
            }

            $KindProperties = Send-V2Request @{
              op = 'request'; id = 'task8.kind-properties'; method = 'source.kindProperties'; params = @{ kind = $KindId }
            }
            if ( -not $KindProperties.status.ok -or [int64]$KindProperties.revision -ne 0 -or
                 [string]$KindProperties.data.target.type -ne 'sourceKind' -or
                 [string]$KindProperties.data.target.kind -ne $KindId ) {
              throw 'source.kindProperties did not delegate to the generic source-kind property form.'
            }

            $EmptyList = Send-V2Request @{
              op = 'request'; id = 'task8.empty-list'; method = 'source.list'; params = @{}
            }
            if ( -not $EmptyList.status.ok -or @($EmptyList.data.sources).Count -ne 0 ) {
              throw 'source.list was not empty before Task 8 created a source.'
            }

            $Create = Send-V2Request @{
              op = 'request'; id = 'task8.create'; method = 'source.create'; ifRevision = 0
              params = @{
                kind = $KindId
                name = 'task8-color'
                settings = @{ width = 320; height = 180; color = 4294901760 }
              }
            }
            if ( -not $Create.status.ok -or [int64]$Create.revision -ne 1 ) {
              throw 'source.create did not commit revision 1.'
            }
            $Source = [string]$Create.data.source
            Assert-CanonicalHandle $Source 'source.create handle'
            $CreatedEvent = Read-StateEvent 'source.created' 1
            if ( [string]$CreatedEvent.data.source -ne $Source ) {
              throw 'source.created identified the wrong source.'
            }

            $List = Send-V2Request @{
              op = 'request'; id = 'task8.list'; method = 'source.list'; params = @{}
            }
            if ( @($List.data.sources).Count -ne 1 -or [string]$List.data.sources[0].source -ne $Source ) {
              throw 'source.list did not expose the engine-managed source.'
            }

            $Get = Send-V2Request @{
              op = 'request'; id = 'task8.get'; method = 'source.get'; params = @{ source = $Source }
            }
            if ( [string]$Get.data.name -ne 'task8-color' -or [string]$Get.data.kind -ne $KindId ) {
              throw 'source.get returned incorrect source identity.'
            }

            $Flags = Send-V2Request @{
              op = 'request'; id = 'task8.flags'; method = 'source.getFlags'; params = @{ source = $Source }
            }
            if ( -not [bool]$Flags.data.hasVideo -or [bool]$Flags.data.hasAudio ) {
              throw 'source.getFlags returned incorrect semantic Color Source flags.'
            }

            $Dimensions = Send-V2Request @{
              op = 'request'; id = 'task8.dimensions'; method = 'source.getDimensions'; params = @{ source = $Source }
            }
            if ( [int]$Dimensions.data.width -ne 320 -or [int]$Dimensions.data.height -ne 180 ) {
              throw 'source.getDimensions did not return initial Color Source dimensions.'
            }

            $Active = Send-V2Request @{
              op = 'request'; id = 'task8.active'; method = 'source.getActive'; params = @{ source = $Source }
            }
            $Showing = Send-V2Request @{
              op = 'request'; id = 'task8.showing'; method = 'source.getShowing'; params = @{ source = $Source }
            }
            if ( [bool]$Active.data.active -or [bool]$Showing.data.showing ) {
              throw 'A newly-created private Color Source unexpectedly began active/showing.'
            }

            $State = Send-V2Request @{
              op = 'request'; id = 'task8.state'; method = 'source.getState'; params = @{ source = $Source }
            }
            if ( [string]$State.data.source -ne $Source -or [int]$State.data.dimensions.width -ne 320 -or
                 [int]$State.data.settings.width -ne 320 ) {
              throw 'source.getState did not return the combined live source snapshot.'
            }

            $LiveProperties = Send-V2Request @{
              op = 'request'; id = 'task8.properties'; method = 'source.getProperties'; params = @{ source = $Source }
            }
            if ( -not $LiveProperties.status.ok -or [string]$LiveProperties.data.target.type -ne 'source' -or
                 [string]$LiveProperties.data.target.source -ne $Source ) {
              throw 'source.getProperties did not delegate to the live-source generic property form.'
            }

            $Missing = Send-V2Request @{
              op = 'request'; id = 'task8.missing'; method = 'source.getMissingFiles'; params = @{ source = $Source }
            }
            if ( -not $Missing.status.ok -or [int]$Missing.data.count -ne 0 ) {
              throw 'Color Source unexpectedly reported missing files.'
            }

            $StaleRename = Send-V2Request @{
              op = 'request'; id = 'task8.stale-rename'; method = 'source.rename'; ifRevision = 0
              params = @{ source = $Source; name = 'must-not-apply' }
            }
            if ( $StaleRename.status.ok -or $StaleRename.status.code -ne 'revision_conflict' -or
                 [int64]$StaleRename.revision -ne 1 ) {
              throw 'A stale source.rename was not rejected at revision 1.'
            }

            $Rename = Send-V2Request @{
              op = 'request'; id = 'task8.rename'; method = 'source.rename'; ifRevision = 1
              params = @{ source = $Source; name = 'task8-renamed' }
            }
            if ( -not $Rename.status.ok -or [int64]$Rename.revision -ne 2 ) {
              throw 'source.rename did not commit revision 2.'
            }
            $RenamedEvent = Read-StateEvent 'source.renamed' 2
            if ( [string]$RenamedEvent.data.previousName -ne 'task8-color' -or
                 [string]$RenamedEvent.data.name -ne 'task8-renamed' ) {
              throw 'source.renamed payload was incorrect.'
            }

            $Duplicate = Send-V2Request @{
              op = 'request'; id = 'task8.duplicate'; method = 'source.duplicate'; ifRevision = 2
              params = @{ source = $Source; name = 'task8-copy' }
            }
            if ( -not $Duplicate.status.ok -or [int64]$Duplicate.revision -ne 3 ) {
              throw 'source.duplicate did not commit revision 3.'
            }
            $Copy = [string]$Duplicate.data.source
            Assert-CanonicalHandle $Copy 'source.duplicate handle'
            if ( $Copy -eq $Source -or [string]$Duplicate.data.duplicateOf -ne $Source ) {
              throw 'source.duplicate did not create an independent engine object.'
            }
            $DuplicateEvent = Read-StateEvent 'source.created' 3
            if ( [string]$DuplicateEvent.data.source -ne $Copy -or
                 [string]$DuplicateEvent.data.duplicateOf -ne $Source ) {
              throw 'Duplicated source.created payload was incorrect.'
            }

            $Replace = Send-V2Request @{
              op = 'request'; id = 'task8.replace'; method = 'source.replaceSettings'; ifRevision = 3
              params = @{ source = $Source; settings = @{ width = 640; height = 360; color = 4278255360 } }
            }
            if ( -not $Replace.status.ok -or [int64]$Replace.revision -ne 4 -or
                 [int]$Replace.data.settings.width -ne 640 -or [int]$Replace.data.settings.height -ne 360 ) {
              throw 'source.replaceSettings did not commit/read back revision 4.'
            }
            $ReplaceSettingsEvent = Read-StateEvent 'source.settingsChanged' 4
            $ReplaceDimensionsEvent = Read-StateEvent 'source.dimensionsChanged' 4
            if ( [int]$ReplaceDimensionsEvent.data.width -ne 640 -or [int]$ReplaceDimensionsEvent.data.height -ne 360 ) {
              throw 'source.replaceSettings did not emit resulting dimensions.'
            }

            $Saved = Send-V2Request @{
              op = 'request'; id = 'task8.save'; method = 'source.saveState'; params = @{ source = $Source }
            }
            if ( -not $Saved.status.ok -or [int64]$Saved.revision -ne 4 -or
                 [int]$Saved.data.state.version -ne 1 -or [string]$Saved.data.state.kind -ne $KindId -or
                 [string]$Saved.data.state.name -ne 'task8-renamed' -or [int]$Saved.data.state.settings.width -ne 640 ) {
              throw 'source.saveState did not return the versioned source-local state without mutating revision.'
            }

            $Reset = Send-V2Request @{
              op = 'request'; id = 'task8.reset'; method = 'source.resetSettings'; ifRevision = 4
              params = @{ source = $Source }
            }
            if ( -not $Reset.status.ok -or [int64]$Reset.revision -ne 5 ) {
              throw 'source.resetSettings did not commit revision 5.'
            }
            $ResetSettingsEvent = Read-StateEvent 'source.settingsChanged' 5
            $ResetDimensionsEvent = Read-StateEvent 'source.dimensionsChanged' 5

            $Saved.data.state.name = 'task8-loaded'
            $Saved.data.state.settings.width = 800
            $Saved.data.state.settings.height = 450
            $Load = Send-V2Request @{
              op = 'request'; id = 'task8.load'; method = 'source.loadState'; ifRevision = 5
              params = @{ source = $Source; state = $Saved.data.state }
            }
            if ( -not $Load.status.ok -or [int64]$Load.revision -ne 6 -or
                 [string]$Load.data.state.name -ne 'task8-loaded' -or
                 [int]$Load.data.state.settings.width -ne 800 -or [int]$Load.data.state.settings.height -ne 450 ) {
              throw 'source.loadState did not restore the edited versioned state at revision 6.'
            }
            $LoadRenamedEvent = Read-StateEvent 'source.renamed' 6
            $LoadSettingsEvent = Read-StateEvent 'source.settingsChanged' 6
            $LoadDimensionsEvent = Read-StateEvent 'source.dimensionsChanged' 6
            if ( [string]$LoadRenamedEvent.data.name -ne 'task8-loaded' -or
                 [int]$LoadDimensionsEvent.data.width -ne 800 -or [int]$LoadDimensionsEvent.data.height -ne 450 ) {
              throw 'source.loadState normalized source events incorrectly.'
            }

            $Refresh = Send-V2Request @{
              op = 'request'; id = 'task8.refresh'; method = 'source.refresh'; params = @{ source = $Source }
            }
            if ( -not $Refresh.status.ok -or [int64]$Refresh.revision -ne 6 -or -not [bool]$Refresh.data.refreshed ) {
              throw 'source.refresh failed or incorrectly consumed a revision.'
            }

            $RemoveCopy = Send-V2Request @{
              op = 'request'; id = 'task8.remove-copy'; method = 'source.remove'; ifRevision = 6
              params = @{ source = $Copy }
            }
            if ( -not $RemoveCopy.status.ok -or [int64]$RemoveCopy.revision -ne 7 ) {
              throw 'Removing the duplicated source did not commit revision 7.'
            }
            $CopyRemoved = Read-StateEvent 'source.removed' 7
            if ( [string]$CopyRemoved.data.source -ne $Copy ) {
              throw 'source.removed identified the wrong duplicated source.'
            }

            $Remove = Send-V2Request @{
              op = 'request'; id = 'task8.remove'; method = 'source.remove'; ifRevision = 7
              params = @{ source = $Source }
            }
            if ( -not $Remove.status.ok -or [int64]$Remove.revision -ne 8 ) {
              throw 'Removing the original source did not commit revision 8.'
            }
            $Removed = Read-StateEvent 'source.removed' 8
            if ( [string]$Removed.data.source -ne $Source ) {
              throw 'source.removed identified the wrong original source.'
            }

            $FinalList = Send-V2Request @{
              op = 'request'; id = 'task8.final-list'; method = 'source.list'; params = @{}
            }
            if ( @($FinalList.data.sources).Count -ne 0 -or [int64]$FinalList.revision -ne 8 ) {
              throw 'source.list was not empty after removing both Task 8 sources.'
            }

            $Close = Send-V2Request @{
              op = 'request'; id = 'task8.close'; method = 'session.close'; params = @{}; ifRevision = 8
            }
            if ( -not $Close.status.ok -or [int64]$Close.revision -ne 9 ) {
              throw 'session.close did not commit revision 9 after the Task 8 lifecycle.'
            }

            $Process.StandardInput.Close()
            if ( -not $Process.WaitForExit(15000) ) {
              $Process.Kill($true)
              throw 'obs-engine did not exit after Task 8 session.close.'
            }
            if ( $Process.ExitCode -ne 0 ) {
              throw "obs-engine exited with code $($Process.ExitCode)."
            }

            Write-Host "Protocol-v2 complete source namespace smoke test passed (next seq=$NextSeq)."
          }
          catch {
            $FailureText = ($_ | Out-String)
            Write-Error $FailureText
            if ( $null -ne $Process -and -not $Process.HasExited ) {
              try {
                $Process.Kill($true)
                $Process.WaitForExit(5000) | Out-Null
              }
              catch {
                Write-Warning "Failed to terminate obs-engine after Task 8 smoke failure: $_"
              }
            }
          }
          finally {
            $StderrText = ''
            if ( $null -ne $ErrorTask ) {
              try {
                $StderrText = $ErrorTask.GetAwaiter().GetResult()
              }
              catch {
                $StderrText = "Failed to collect redirected stderr: $_"
              }
            }

            $ExitState = 'not-started'
            if ( $null -ne $Process ) {
              if ( $Process.HasExited ) {
                $ExitState = "exited:$($Process.ExitCode)"
              } else {
                $ExitState = 'still-running'
              }
            }

            @(
              "engine=$($Engine.FullName)"
              "exit_state=$ExitState"
              "next_seq=$NextSeq"
              ''
              '=== smoke failure ==='
              $FailureText
              ''
              '=== obs-engine stderr ==='
              $StderrText
            ) | Set-Content -Path $DiagnosticFile -Encoding utf8
          }

          if ( $null -ne $FailureText ) {
            throw 'Protocol-v2 source namespace smoke test failed. See _task8-diagnostics/v2-source-smoke.txt in the runtime artifact.'
          }

      - name: Upload Task 8 Windows runtime
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: obs-engine-windows-x64-task8
          path: build_x64/install/
          if-no-files-found: error
          compression-level: 6
          retention-days: 7

      - name: Enforce Task 8 smoke result
        if: steps.smoke_v2_source.outcome != 'success'
        shell: pwsh
        run: |
          throw 'Protocol-v2 source namespace smoke test failed; runtime artifact was preserved for diagnostics.'
