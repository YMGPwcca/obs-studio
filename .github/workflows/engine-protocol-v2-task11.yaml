name: Engine Protocol v2 Task 11 Verification

on:
  push:
    branches:
      - engine-protocol-v2

permissions:
  contents: write

jobs:
  integrate-task11:
    name: Integrate reviewed Task 11 delta
    if: github.event.head_commit.message == 'chore(engine): run Task 11 direct integrator'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Apply reviewed integration
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/task11-integrate.py
          git diff --check
          test ! -e engine/runtime_filter_source_duplicate_v2.cpp
          test ! -e engine/TASK11_INTEGRATION_NOTE.tmp
          test ! -e .github/TASK11_STAGING_DO_NOT_USE.tmp
          test ! -e .github/workflows/task11-one-shot-integrator.yaml
          test ! -e .github/scripts/task11-integrate.py

      - name: Commit integrated Task 11 candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Task 11 integration bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat(engine): integrate protocol v2 filter namespace'
          git push origin HEAD:engine-protocol-v2
