name: Engine Protocol v2 Task 11 Verification

on:
  push:
    branches:
      - engine-protocol-v2
      - task11-codex
  workflow_dispatch:

permissions:
  contents: read

jobs:
  filter-v1:
    name: Build and verify filter namespace
    runs-on: windows-2025-vs2026
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Verify Task 10 core isolation and Task 11 callback ordering
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & .github/scripts/engine-protocol-v2-task11-core-audit.ps1
      - name: Build Windows minimal runtime
        uses: ./.github/actions/build-obs
        with:
          target: x64
          config: RelWithDebInfo

      - name: Verify normal package excludes fixtures and second APIs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & .github/scripts/engine-protocol-v2-task11-package-audit.ps1
      - name: Build CI-only deterministic filter source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & .github/scripts/engine-protocol-v2-task11-build-fixture.ps1
      - name: Stage CI-only filter source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & .github/scripts/engine-protocol-v2-task11-stage-fixture.ps1
      - name: Run Task 11 filter integration regression
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & '.github/scripts/engine-protocol-v2-task11.ps1' -InstallRoot (Resolve-Path 'build_x64/install')

      - name: Run Task 11 timeout ownership race regression
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & '.github/scripts/engine-protocol-v2-task11-timeout-race.ps1' -InstallRoot (Resolve-Path 'build_x64/install')

      - name: Remove explicitly staged Task 11 test source
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & .github/scripts/engine-protocol-v2-task11-remove-fixture.ps1
      - name: Upload Task 11 Windows runtime
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: obs-engine-windows-x64-task11
          path: build_x64/install/
          if-no-files-found: error
          compression-level: 6
          retention-days: 7
