name: Engine Protocol v2 Task 3 Verification

on:
  push:
    branches:
      - engine-protocol-v2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-smoke-package-x64:
    name: Build, capability smoke test, and package x64
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Build Windows minimal runtime
        uses: ./.github/actions/build-obs
        with:
          target: x64
          config: RelWithDebInfo

      - name: Smoke test protocol v2 capabilities
        id: smoke_v2_capabilities
        continue-on-error: true
        timeout-minutes: 5
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $InstallRoot = Resolve-Path 'build_x64/install'
          $DiagnosticDir = Join-Path $InstallRoot '_task3-diagnostics'
          New-Item -ItemType Directory -Force -Path $DiagnosticDir | Out-Null
          $DiagnosticFile = Join-Path $DiagnosticDir 'v2-capabilities-smoke.txt'

          $Process = $null
          $ErrorTask = $null
          $Engine = $null
          $FailureText = $null

          try {
            $Engine = Get-ChildItem -Path $InstallRoot -Filter 'obs-engine.exe' -File -Recurse |
              Select-Object -First 1
            if ( $null -eq $Engine ) {
              throw 'obs-engine.exe was not found in the installed runtime.'
            }

            $StartInfo = [System.Diagnostics.ProcessStartInfo]::new()
            $StartInfo.FileName = $Engine.FullName
            $StartInfo.WorkingDirectory = $Engine.Directory.FullName
            $StartInfo.UseShellExecute = $false
            $StartInfo.RedirectStandardInput = $true
            $StartInfo.RedirectStandardOutput = $true
            $StartInfo.RedirectStandardError = $true
            $StartInfo.CreateNoWindow = $true

            $Process = [System.Diagnostics.Process]::new()
            $Process.StartInfo = $StartInfo
            if ( -not $Process.Start() ) {
              throw 'Failed to start obs-engine.exe.'
            }
            $ErrorTask = $Process.StandardError.ReadToEndAsync()

            function Read-EngineMessage {
              $ReadTask = $Process.StandardOutput.ReadLineAsync()
              if ( -not $ReadTask.Wait(30000) ) {
                throw 'Timed out waiting 30 seconds for obs-engine stdout.'
              }
              $Line = $ReadTask.Result
              if ( $null -eq $Line ) {
                $ExitText = if ( $Process.HasExited ) { "exit=$($Process.ExitCode)" } else { 'process still running' }
                throw "obs-engine closed stdout unexpectedly ($ExitText)."
              }
              Write-Host "obs-engine stdout: $Line"
              return ($Line | ConvertFrom-Json)
            }

            function Send-V2Request([hashtable] $Request) {
              $Json = $Request | ConvertTo-Json -Compress -Depth 20
              Write-Host "obs-engine stdin:  $Json"
              $Process.StandardInput.WriteLine($Json)
              $Process.StandardInput.Flush()
              return Read-EngineMessage
            }

            function Get-CapabilityNames($Response) {
              return @($Response.data.capabilities | ForEach-Object { [string]$_.name })
            }

            $RequiredCapabilities = @(
              'engine.capabilities.v1'
              'session.close.v1'
              'session.hello.v1'
              'session.ping.v1'
            )

            $Ready = Read-EngineMessage
            if ( $Ready.event -ne 'ready' -or [int]$Ready.protocol -ne 1 ) {
              throw 'Migration bootstrap ready event changed unexpectedly.'
            }

            $Hello = Send-V2Request @{
              op = 'request'
              id = 'task3.hello'
              method = 'session.hello'
              params = @{}
            }
            if ( $Hello.op -ne 'response' -or $Hello.id -ne 'task3.hello' -or -not $Hello.status.ok ) {
              throw 'session.hello did not return a valid v2 success envelope.'
            }
            if ( [int]$Hello.data.protocol.major -ne 2 -or [int]$Hello.data.protocol.minor -ne 0 ) {
              throw 'session.hello returned an unexpected protocol version.'
            }
            if ( [int64]$Hello.revision -ne 0 -or [int64]$Hello.data.revision -ne 0 ) {
              throw 'Read-only session.hello unexpectedly changed revision state.'
            }

            $HelloNames = Get-CapabilityNames $Hello
            foreach ( $Required in $RequiredCapabilities ) {
              if ( $HelloNames -notcontains $Required ) {
                throw "session.hello lost required Task 3 capability: $Required"
              }
            }
            foreach ( $Capability in @($Hello.data.capabilities) ) {
              if ( [string]::IsNullOrWhiteSpace([string]$Capability.name) ) {
                throw 'Capability descriptor is missing a name.'
              }
              if ( [bool]$Capability.experimental ) {
                throw "Stable capability was unexpectedly marked experimental: $($Capability.name)"
              }
            }
            if ( $HelloNames -contains 'source.v1' ) {
              throw 'Partial method support must not claim the complete source.v1 namespace capability.'
            }

            $GetCapabilities = Send-V2Request @{
              op = 'request'
              id = 'task3.capabilities'
              method = 'engine.getCapabilities'
              params = @{}
            }
            if ( $GetCapabilities.id -ne 'task3.capabilities' -or -not $GetCapabilities.status.ok ) {
              throw 'engine.getCapabilities failed.'
            }
            if ( [int64]$GetCapabilities.revision -ne 0 ) {
              throw 'engine.getCapabilities unexpectedly changed the revision.'
            }
            $GetCapabilityNames = Get-CapabilityNames $GetCapabilities
            if ( ($GetCapabilityNames -join '|') -ne ($HelloNames -join '|') ) {
              throw 'engine.getCapabilities does not match session.hello capability advertisement.'
            }

            $Unknown = Send-V2Request @{
              op = 'request'
              id = 'task3.unimplemented'
              method = 'source.rename'
              params = @{}
            }
            if ( $Unknown.id -ne 'task3.unimplemented' -or $Unknown.status.ok -or
                 $Unknown.status.code -ne 'unsupported_method' ) {
              throw 'Capability advertisement leaked an unimplemented v2 semantic method.'
            }

            $Ping = Send-V2Request @{
              op = 'request'
              id = 'task3.ping'
              method = 'session.ping'
              params = @{}
            }
            if ( $Ping.id -ne 'task3.ping' -or -not $Ping.status.ok -or -not $Ping.data.pong ) {
              throw 'session.ping regressed during Task 3.'
            }

            $Close = Send-V2Request @{
              op = 'request'
              id = 'task3.close'
              method = 'session.close'
              params = @{}
            }
            if ( $Close.id -ne 'task3.close' -or -not $Close.status.ok ) {
              throw 'session.close regressed during Task 3.'
            }

            $Process.StandardInput.Close()
            if ( -not $Process.WaitForExit(15000) ) {
              $Process.Kill($true)
              throw 'obs-engine did not exit after session.close.'
            }
            if ( $Process.ExitCode -ne 0 ) {
              throw "obs-engine exited with code $($Process.ExitCode)."
            }

            Write-Host 'Protocol-v2 capability smoke test passed.'
          }
          catch {
            $FailureText = ($_ | Out-String)
            Write-Error $FailureText
            if ( $null -ne $Process -and -not $Process.HasExited ) {
              try {
                $Process.Kill($true)
                $Process.WaitForExit(5000) | Out-Null
              }
              catch {
                Write-Warning "Failed to terminate obs-engine after Task 3 smoke failure: $_"
              }
            }
          }
          finally {
            $StderrText = ''
            if ( $null -ne $ErrorTask ) {
              try {
                $StderrText = $ErrorTask.GetAwaiter().GetResult()
              }
              catch {
                $StderrText = "Failed to collect redirected stderr: $_"
              }
            }

            $ExitState = 'not-started'
            if ( $null -ne $Process ) {
              if ( $Process.HasExited ) {
                $ExitState = "exited:$($Process.ExitCode)"
              } else {
                $ExitState = 'still-running'
              }
            }

            @(
              "engine=$($Engine.FullName)"
              "exit_state=$ExitState"
              ''
              '=== smoke failure ==='
              $FailureText
              ''
              '=== obs-engine stderr ==='
              $StderrText
            ) | Set-Content -Path $DiagnosticFile -Encoding utf8
          }

          if ( $null -ne $FailureText ) {
            throw 'Protocol-v2 capability smoke test failed. See _task3-diagnostics/v2-capabilities-smoke.txt in the runtime artifact.'
          }

      - name: Upload Task 3 Windows runtime
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: obs-engine-windows-x64-task3
          path: build_x64/install/
          if-no-files-found: error
          compression-level: 6
          retention-days: 7

      - name: Enforce Task 3 smoke result
        if: steps.smoke_v2_capabilities.outcome != 'success'
        shell: pwsh
        run: |
          throw 'Protocol-v2 capability smoke test failed; runtime artifact was preserved for diagnostics.'
