name: Engine Protocol v2 Task 8 Concurrency Regression

on:
  push:
    branches:
      - engine-protocol-v2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-event-capture-thread-isolation:
    name: Verify source event capture thread isolation
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Compile and run capture routing regression
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & .github/scripts/engine-protocol-v2-task8-concurrency-capture-routing.ps1
      - name: Verify production bridge ordering and isolation invariants
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & .github/scripts/engine-protocol-v2-task8-concurrency-bridge-audit.ps1
  deterministic-source-concurrency-a-f:
    name: Verify deterministic source concurrency A-F
    runs-on: windows-2025-vs2026
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Build Windows minimal runtime
        uses: ./.github/actions/build-obs
        with:
          target: x64
          config: RelWithDebInfo

      - name: Build CI-only deterministic source module
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & .github/scripts/engine-protocol-v2-task8-concurrency-build-fixture.ps1
      - name: Run deterministic A-F integration regression
        id: concurrency_regression
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & .github/scripts/engine-protocol-v2-task8-concurrency-run.ps1
      - name: Upload Task 8 concurrency diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: obs-engine-task8-concurrency-diagnostics
          path: build_x64/install/_task8-concurrency-diagnostics/
          if-no-files-found: warn
          compression-level: 6
          retention-days: 7

      - name: Enforce deterministic A-F regression
        if: steps.concurrency_regression.outcome != 'success'
        shell: pwsh
        run: |
          throw 'Task 8 deterministic concurrency regression failed; diagnostic transcript was preserved.'
