name: Engine Protocol v2 Task 29 Verification

on:
  push:
    branches:
      - phase3-output-stack
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay-buffer-v1:
    name: Build and verify replay-buffer orchestration
    runs-on: windows-2025-vs2026
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Build Windows minimal runtime
        uses: ./.github/actions/build-obs
        with:
          target: x64
          config: RelWithDebInfo
      - name: Audit normal package
        shell: pwsh
        run: '& .github/scripts/engine-protocol-v2-task29-package-audit.ps1 -InstallRoot (Resolve-Path ''build_x64/install'')'
      - name: Build CI-only replay fixtures
        shell: pwsh
        run: '& .github/scripts/engine-protocol-v2-task29-build-fixture.ps1'
      - name: Stage CI-only replay fixtures
        shell: pwsh
        run: '& .github/scripts/engine-protocol-v2-task29-stage-fixture.ps1 -InstallRoot (Resolve-Path ''build_x64/install'') -FixtureDirectory (Resolve-Path ''build_x64/engine/RelWithDebInfo'')'
      - name: Run Task 29 replay-buffer integration
        shell: pwsh
        run: '& .github/scripts/engine-protocol-v2-task29.ps1 -InstallRoot (Resolve-Path ''build_x64/install'')'
      - name: Remove CI-only replay fixtures
        if: always()
        shell: pwsh
        run: '& .github/scripts/engine-protocol-v2-task29-remove-fixture.ps1 -InstallRoot (Resolve-Path ''build_x64/install'')'
      - name: Audit package after fixture cleanup
        if: always()
        shell: pwsh
        run: '& .github/scripts/engine-protocol-v2-task29-package-audit.ps1 -InstallRoot (Resolve-Path ''build_x64/install'')'
