name: Engine Protocol v2 Task 10 Verification

on:
  push:
    branches:
      - engine-protocol-v2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  media-v1:
    name: Build and verify media namespace
    runs-on: windows-2025-vs2026
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Build Windows minimal runtime
        uses: ./.github/actions/build-obs
        with:
          target: x64
          config: RelWithDebInfo

      - name: Verify normal package excludes Task 10 fixture and second APIs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $InstallRoot = Resolve-Path 'build_x64/install'
          $Forbidden = Get-ChildItem -Path $InstallRoot -File -Recurse | Where-Object {
            $_.Name -in @(
              'task10-media-source.dll',
              'obs64.exe',
              'obs32.exe',
              'obs-websocket.dll',
              'obs-browser.dll'
            )
          }
          if (@($Forbidden).Count -ne 0) {
            throw "Forbidden or CI-only files leaked into the normal engine package:`n$($Forbidden.FullName -join "`n")"
          }

      - name: Build CI-only deterministic media source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cmake --build build_x64 --config RelWithDebInfo --target obs-engine-task10-media-plugin --parallel
          if ($LASTEXITCODE -ne 0) {
            throw "Task 10 media source build failed (exit=$LASTEXITCODE)."
          }

      - name: Stage CI-only media source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $InstallRoot = Resolve-Path 'build_x64/install'
          $Plugin = Get-ChildItem -Path 'build_x64' -Filter 'task10-media-source.dll' -File -Recurse |
            Where-Object { $_.FullName -notlike "$InstallRoot*" } |
            Select-Object -First 1
          if ($null -eq $Plugin) {
            throw 'Built Task 10 media source was not found.'
          }
          $RuntimeModule = Get-ChildItem -Path $InstallRoot -Filter 'image-source.dll' -File -Recurse |
            Select-Object -First 1
          if ($null -eq $RuntimeModule) {
            throw 'Could not locate the installed OBS module directory.'
          }
          Copy-Item -LiteralPath $Plugin.FullName -Destination (Join-Path $RuntimeModule.Directory.FullName $Plugin.Name) -Force

      - name: Run Task 10 media integration regression
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & '.github/scripts/engine-protocol-v2-task10.ps1' -InstallRoot (Resolve-Path 'build_x64/install')

      - name: Remove explicitly staged Task 10 test source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $InstallRoot = Resolve-Path 'build_x64/install'
          $Installed = Get-ChildItem -Path $InstallRoot -Filter 'task10-media-source.dll' -File -Recurse
          if (@($Installed).Count -ne 1) {
            throw 'Expected exactly one explicitly staged Task 10 media module.'
          }
          Remove-Item -LiteralPath $Installed[0].FullName -Force
          $Remaining = Get-ChildItem -Path $InstallRoot -Filter 'task10-media-source.dll' -File -Recurse
          if (@($Remaining).Count -ne 0) {
            throw 'Task 10 CI-only media module remained in the install tree after cleanup.'
          }

      - name: Upload Task 10 Windows runtime
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: obs-engine-windows-x64-task10
          path: build_x64/install/
          if-no-files-found: error
          compression-level: 6
          retention-days: 7
