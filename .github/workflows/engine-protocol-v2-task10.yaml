name: Engine Protocol v2 Task 10 Verification

on:
  push:
    branches:
      - engine-protocol-v2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  media-v1:
    name: Build and verify media namespace
    runs-on: windows-2025-vs2026
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Build Windows minimal runtime
        uses: ./.github/actions/build-obs
        with:
          target: x64
          config: RelWithDebInfo

      - name: Verify normal package excludes Task 10 fixture and second APIs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & .github/scripts/engine-protocol-v2-task10-package-audit.ps1
      - name: Build CI-only deterministic media source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & .github/scripts/engine-protocol-v2-task10-build-fixture.ps1
      - name: Stage CI-only media source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & .github/scripts/engine-protocol-v2-task10-stage-fixture.ps1
      - name: Run Task 10 media integration regression
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & '.github/scripts/engine-protocol-v2-task10.ps1' -InstallRoot (Resolve-Path 'build_x64/install')

      - name: Remove explicitly staged Task 10 test source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & .github/scripts/engine-protocol-v2-task10-remove-fixture.ps1
      - name: Upload Task 10 Windows runtime
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: obs-engine-windows-x64-task10
          path: build_x64/install/
          if-no-files-found: error
          compression-level: 6
          retention-days: 7
