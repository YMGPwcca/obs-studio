name: Engine Protocol v2 Task 26 Verification

on:
  push:
    branches:
      - phase3-output-stack
  workflow_dispatch:

permissions:
  contents: read

jobs:
  output-v1:
    name: Build and verify output state machine
    runs-on: windows-2025-vs2026
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Build Windows minimal runtime
        uses: ./.github/actions/build-obs
        with:
          target: x64
          config: RelWithDebInfo
      - name: Audit normal package
        shell: pwsh
        run: '& .github/scripts/engine-protocol-v2-task26-package-audit.ps1 -InstallRoot (Resolve-Path ''build_x64/install'')'
      - name: Build CI-only output fixtures
        shell: pwsh
        run: '& .github/scripts/engine-protocol-v2-task26-build-fixture.ps1'
      - name: Stage CI-only output fixtures
        shell: pwsh
        run: '& .github/scripts/engine-protocol-v2-task26-stage-fixture.ps1 -InstallRoot (Resolve-Path ''build_x64/install'') -FixtureDirectory (Resolve-Path ''build_x64/engine/RelWithDebInfo'')'
      - name: Run Task 26 output integration
        shell: pwsh
        run: '& .github/scripts/engine-protocol-v2-task26.ps1 -InstallRoot (Resolve-Path ''build_x64/install'')'
      - name: Remove CI-only output fixtures
        if: always()
        shell: pwsh
        run: '& .github/scripts/engine-protocol-v2-task26-remove-fixture.ps1 -InstallRoot (Resolve-Path ''build_x64/install'')'
      - name: Audit package after fixture cleanup
        if: always()
        shell: pwsh
        run: '& .github/scripts/engine-protocol-v2-task26-package-audit.ps1 -InstallRoot (Resolve-Path ''build_x64/install'')'
