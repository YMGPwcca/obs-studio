name: Engine Protocol v2 Task 21 Verification

on:
  push:
    branches:
      - phase3-output-stack
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audio-v1:
    name: Build and verify audio namespace
    runs-on: windows-2025-vs2026
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Build Windows minimal runtime
        uses: ./.github/actions/build-obs
        with:
          target: x64
          config: RelWithDebInfo
      - name: Audit normal package
        shell: pwsh
        run: '& .github/scripts/engine-protocol-v2-task21-package-audit.ps1'
      - name: Build CI-only audio fixture
        shell: pwsh
        run: '& .github/scripts/engine-protocol-v2-task21-build-fixture.ps1'
      - name: Stage CI-only audio fixture
        shell: pwsh
        run: '& .github/scripts/engine-protocol-v2-task21-stage-fixture.ps1'
      - name: Run Task 21 audio integration
        shell: pwsh
        run: '& .github/scripts/engine-protocol-v2-task21.ps1 -InstallRoot (Resolve-Path ''build_x64/install'')'
      - name: Remove CI-only audio fixture
        if: always()
        shell: pwsh
        run: '& .github/scripts/engine-protocol-v2-task21-remove-fixture.ps1'
      - name: Audit package after fixture cleanup
        if: always()
        shell: pwsh
        run: '& .github/scripts/engine-protocol-v2-task21-package-audit.ps1'
      - name: Upload Task 21 Windows runtime
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: obs-engine-windows-x64-task21
          path: build_x64/install/
          if-no-files-found: error
          compression-level: 6
          retention-days: 7
