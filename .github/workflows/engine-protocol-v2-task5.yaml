name: Engine Protocol v2 Task 5 Verification

on:
  push:
    branches:
      - engine-protocol-v2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-smoke-package-x64:
    name: Build, event queue/subscription smoke test, and package x64
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Build Windows minimal runtime
        uses: ./.github/actions/build-obs
        with:
          target: x64
          config: RelWithDebInfo

      - name: Build and run bounded event queue policy test
        id: queue_policy
        continue-on-error: true
        timeout-minutes: 5
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & .github/scripts/engine-protocol-v2-task5-event-queue-policy.ps1
      - name: Smoke test protocol v2 subscriptions and event delivery
        id: smoke_v2_events
        continue-on-error: true
        timeout-minutes: 5
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & .github/scripts/engine-protocol-v2-task5-subscriptions.ps1
      - name: Upload Task 5 Windows runtime
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: obs-engine-windows-x64-task5
          path: build_x64/install/
          if-no-files-found: error
          compression-level: 6
          retention-days: 7

      - name: Enforce Task 5 verification result
        if: steps.queue_policy.outcome != 'success' || steps.smoke_v2_events.outcome != 'success'
        shell: pwsh
        run: |
          throw 'Task 5 event queue/subscription verification failed; runtime artifact was preserved for diagnostics.'
