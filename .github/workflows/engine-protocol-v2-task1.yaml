name: Engine Protocol v2 Task 1.1 Verification

on:
  push:
    branches:
      - engine-protocol-v2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-smoke-package-x64:
    name: Build, smoke test, and package x64
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Build Windows minimal runtime
        uses: ./.github/actions/build-obs
        with:
          target: x64
          config: RelWithDebInfo

      - name: Verify headless runtime footprint
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & .github/scripts/engine-protocol-v2-task1-footprint.ps1
      - name: Smoke test obs-engine protocol v1
        id: smoke
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & .github/scripts/engine-protocol-v2-task1-protocol-v1.ps1
      - name: Upload installed Windows runtime
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: obs-engine-windows-x64-task1-1
          path: build_x64/install/
          if-no-files-found: error
          compression-level: 6
          retention-days: 7

      - name: Enforce smoke result
        if: steps.smoke.outcome != 'success'
        shell: pwsh
        run: |
          throw 'Protocol-v1 smoke test failed; runtime artifact was preserved for diagnostics.'
